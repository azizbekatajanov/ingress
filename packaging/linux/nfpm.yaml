# nfpm (https://nfpm.goreleaser.com) package definition for the .deb.
# ${VERSION} is substituted by the release workflow via envsubst before
# nfpm reads this file — kept as a literal placeholder here rather than a
# real version so this file doesn't need editing on every release.
name: ingress
arch: amd64
platform: linux
version: ${VERSION}
maintainer: Azizbek Atajanov
homepage: https://github.com/azizbekatajanov/ingress
description: |
  Менеджер нескольких одновременных VPN-туннелей: Fortinet SSL-VPN и
  Palo Alto GlobalProtect (включая вход через SAML). Держит несколько
  профилей подключёнными одновременно. VPN-клиенты (openfortivpn,
  OpenConnect) Ingress скачивает и проверяет сам при первом подключении.
section: net
priority: optional
depends:
  # Debian 13 / Ubuntu 24.04+ split policykit-1 into polkitd + pkexec and
  # (Debian) dropped the old name; accept either.
  - pkexec | policykit-1
  - libwebkit2gtk-4.1-0
  - libgtk-3-0
recommends:
  # openfortivpn (Fortinet profiles) drives the system pppd; GlobalProtect
  # (openconnect) doesn't need it. iproute2 is what vpnc-script uses.
  - ppp
  - iproute2
scripts:
  postinstall: ./postinst.sh
  postremove: ./postrm.sh
contents:
  - src: ../../build/bin/ingress
    dst: /usr/bin/ingress
    file_info:
      mode: 0755
  - src: ./ingress.desktop
    dst: /usr/share/applications/ingress.desktop
  - src: ../../build/appicon.png
    dst: /usr/share/icons/hicolor/1024x1024/apps/ingress.png
