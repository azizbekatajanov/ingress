name: Release builds

# Builds Linux and Windows artifacts on their native runners (this repo's
# macOS release is still built and uploaded locally — see the release notes
# for why: it needs the same signing/DMG steps regardless, and keeping one
# platform's process manual isn't worth a whole extra CI job yet).
#
# Two ways to run this:
# - Push a tag matching v* (e.g. `git push origin v1.0.3`) — builds for that
#   tag automatically and uploads to the matching GitHub Release, which must
#   already exist (created via `gh release create`, same as the macOS build).
# - Manually via the Actions tab (workflow_dispatch), giving an existing tag
#   — used to backfill Linux/Windows artifacts onto a release that was
#   already published macOS-only (exactly what v1.0.2 needed).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload artifacts for (e.g. v1.0.2)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gettext-base

      - name: Install Wails CLI and nfpm
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Build
        # -tags webkit2_41: Ubuntu 24.04 (this runner's image) only ships
        # libwebkit2gtk-4.1-dev — the 4.0 package Wails links against by
        # default was dropped upstream. Confirmed live: the default build
        # failed with "Package webkit2gtk-4.0 was not found in the
        # pkg-config search path" despite 4.1-dev being installed above;
        # this tag is Wails' own documented opt-in for the 4.1 pkg-config name.
        run: wails build -clean -platform linux/amd64 -tags webkit2_41

      - name: Package (tar.gz)
        run: |
          set -e
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          STAGE=/tmp/ingress-linux
          mkdir -p "$STAGE"
          cp build/bin/ingress "$STAGE/"
          cp README.md "$STAGE/"
          tar -C /tmp -czf "Ingress-${VERSION}-linux-amd64.tar.gz" ingress-linux
          echo "TARBALL=Ingress-${VERSION}-linux-amd64.tar.gz" >> "$GITHUB_ENV"

      - name: Package (.deb)
        # nfpm (https://nfpm.goreleaser.com) is a pure-Go deb/rpm/apk
        # packager — no dpkg-deb/fakeroot/rpmbuild needed, just the config
        # in packaging/linux/nfpm.yaml. envsubst fills in ${VERSION}; nfpm's
        # own env-expansion support isn't relied on since its exact syntax
        # wasn't verifiable without a real run.
        run: |
          set -e
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          export VERSION
          cd packaging/linux
          envsubst < nfpm.yaml > nfpm.generated.yaml
          DEB="Ingress-${VERSION}-linux-amd64.deb"
          nfpm package --config nfpm.generated.yaml --packager deb --target "../../$DEB"
          cd ../..
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Checksums
        run: |
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          shasum -a 256 "$DEB" > "$DEB.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "$TARBALL" "$TARBALL.sha256" "$DEB" "$DEB.sha256" --clobber --repo "${{ github.repository }}"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build (NSIS installer)
        run: wails build -clean -platform windows/amd64 -nsis

      - name: Rename installer
        shell: bash
        run: |
          set -e
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          SRC=$(find build/bin -iname "*.exe" | head -n1)
          DEST="Ingress-${VERSION}-windows-amd64-installer.exe"
          cp "$SRC" "$DEST"
          echo "ASSET=$DEST" >> "$GITHUB_ENV"

      - name: Checksum
        shell: bash
        run: |
          certutil -hashfile "$ASSET" SHA256 | sed -n '2p' | tr -d '\r' | awk -v f="$ASSET" '{print $1"  "f}' > "$ASSET.sha256"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber --repo "${{ github.repository }}"
